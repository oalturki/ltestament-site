# Sends the recitation-check service (asr-space/) to its Hugging Face Space whenever it changes.
# Needs, in the GitHub repo settings: variable HF_SPACE (e.g. "ltestament/tasmee") and secret HF_TOKEN
# (a Hugging Face token with write access to that Space). Neither is ever written in the code.
name: Deploy recitation check to Hugging Face
on:
  push:
    branches: [main]
    paths: ["asr-space/**", ".github/workflows/hf-space.yml"]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push asr-space/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd asr-space
          git init -q -b main
          git config user.name "ltestament deploy"
          git config user.email "deploy@ltestament.com"
          git lfs install --local >/dev/null 2>&1 || true
          git add -A
          git commit -qm "Deploy from ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
