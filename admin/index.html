<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>لوحة المشرف — العهد الأخير</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#101B33; --deep:#0A1425; --parch:#F3E8D0; --gold:#C89B3C; --gold2:#DCC078; --teal:#3E7C74; --ink:#1B1B18; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Tajawal',sans-serif; background:var(--parch); color:var(--ink); line-height:1.7; }
  header{ background:var(--deep); color:var(--parch); padding:18px 5vw; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1{ font-size:1.2rem; font-weight:800; } header h1 span{ color:var(--gold2); }
  header .who{ font-size:0.85rem; opacity:0.8; display:flex; gap:12px; align-items:center; }
  main{ max-width:1000px; margin:0 auto; padding:30px 5vw 80px; }
  button{ font:inherit; cursor:pointer; }
  .btn{ border:0; padding:8px 18px; border-radius:3px; font-weight:700; font-size:0.88rem; }
  .btn-gold{ background:var(--gold); color:var(--deep); } .btn-gold:hover{ background:var(--gold2); }
  .btn-ghost{ background:transparent; border:1px solid rgba(27,27,24,0.25); color:var(--ink); }
  .btn-ok{ background:var(--teal); color:#fff; } .btn-no{ background:#a24b4b; color:#fff; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  header .btn-ghost{ color:var(--parch); border-color:rgba(243,232,208,0.35); }
  .card{ background:#FBF4E3; border-top:3px solid var(--gold); padding:24px; margin-bottom:24px; }
  .login{ max-width:380px; margin:60px auto; }
  .login label{ display:block; font-weight:700; font-size:0.9rem; margin:14px 0 6px; }
  .login input{ width:100%; padding:10px 12px; border:1px solid rgba(27,27,24,0.2); border-radius:3px; font:inherit; direction:ltr; text-align:left; background:#fff; }
  .pw{ position:relative; }
  .pw input{ padding-right:70px; }
  .pw-toggle{ position:absolute; top:50%; right:6px; transform:translateY(-50%); background:transparent; border:0; color:var(--teal); font-weight:700; font-size:0.82rem; padding:4px 8px; }
  .login .btn{ margin-top:20px; width:100%; padding:11px; }
  .msg{ margin-top:12px; font-size:0.9rem; color:#a24b4b; min-height:1.3em; }
  h2{ font-size:1.15rem; margin-bottom:14px; }
  table{ width:100%; border-collapse:collapse; font-size:0.92rem; }
  th, td{ padding:8px 10px; border-bottom:1px solid rgba(27,27,24,0.1); text-align:center; }
  th{ color:var(--teal); font-weight:700; }
  tr.total td{ font-weight:800; background:rgba(200,155,60,0.12); }
  .avg{ color:var(--gold); font-weight:800; }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .tab{ background:transparent; border:1px solid rgba(27,27,24,0.2); padding:6px 14px; border-radius:20px; font-size:0.85rem; }
  .tab.on{ background:var(--night); color:var(--parch); border-color:var(--night); }
  select{ font:inherit; padding:6px 10px; border-radius:4px; border:1px solid rgba(27,27,24,0.2); background:#fff; }
  .item{ background:#fff; border:1px solid rgba(27,27,24,0.08); border-inline-start:4px solid #ccc; padding:16px 18px; margin-bottom:12px; }
  .item.pending{ border-inline-start-color:var(--gold); } .item.approved{ border-inline-start-color:var(--teal); } .item.rejected{ border-inline-start-color:#a24b4b; }
  .meta{ display:flex; gap:14px; flex-wrap:wrap; font-size:0.82rem; color:#6b644f; margin-bottom:8px; }
  .stars{ color:var(--gold); letter-spacing:2px; direction:ltr; }
  .comment{ white-space:pre-line; margin:6px 0 12px; unicode-bidi:plaintext; }
  .comment.empty{ color:#999; font-style:italic; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .note{ font-size:0.8rem; color:#a24b4b; }
  .tag{ display:inline-block; padding:1px 8px; border-radius:10px; font-size:0.75rem; font-weight:700; }
  .tag.pending{ background:rgba(200,155,60,0.18); color:#7a5a17; } .tag.approved{ background:rgba(62,124,116,0.15); color:var(--teal); } .tag.rejected{ background:rgba(162,75,75,0.12); color:#a24b4b; }
  .empty-list{ text-align:center; color:#8a836e; padding:30px 0; }
  .maintabs{ display:flex; gap:6px; margin-bottom:22px; border-bottom:2px solid rgba(27,27,24,0.1); }
  .maintab{ background:none; border:0; padding:10px 22px; font-weight:800; font-size:1rem; color:#6b644f; border-bottom:3px solid transparent; margin-bottom:-2px; }
  .maintab.on{ color:var(--ink); border-bottom-color:var(--gold); }
  .maintab .badge{ background:var(--gold); color:var(--deep); border-radius:10px; padding:0 7px; font-size:0.75rem; margin-inline-start:4px; }
  .tag.new{ background:rgba(200,155,60,0.18); color:#7a5a17; } .tag.assigned{ background:rgba(16,27,51,0.1); color:var(--night); } .tag.answered{ background:rgba(62,124,116,0.15); color:var(--teal); } .tag.closed{ background:rgba(27,27,24,0.08); color:#6b644f; }
  .item.new{ border-inline-start-color:var(--gold); } .item.assigned{ border-inline-start-color:var(--night); } .item.answered{ border-inline-start-color:var(--teal); } .item.closed{ border-inline-start-color:#bbb; }
  .contact{ display:inline-flex; gap:8px; align-items:center; background:rgba(62,124,116,0.08); padding:4px 12px; border-radius:14px; font-size:0.85rem; margin-bottom:10px; direction:ltr; }
  .contact a{ color:var(--teal); font-weight:700; text-decoration:none; }
  .qrow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .notes{ margin-top:12px; border-top:1px dashed rgba(27,27,24,0.15); padding-top:10px; }
  .notes .n{ font-size:0.85rem; background:#FBF4E3; padding:8px 12px; margin-bottom:6px; white-space:pre-line; unicode-bidi:plaintext; }
  .notes .n small{ display:block; color:#8a836e; font-size:0.75rem; }
  .notes form{ display:flex; gap:8px; margin-top:6px; }
  .notes textarea{ flex:1; font:inherit; font-size:0.88rem; padding:6px 10px; border:1px solid rgba(27,27,24,0.2); border-radius:4px; min-height:38px; }
  .inline-msg{ font-size:0.82rem; color:#a24b4b; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<header>
  <h1>العهد الأخير <span>· لوحة المشرف</span></h1>
  <div class="who" id="who" hidden><span id="whoEmail"></span><button class="btn btn-ghost" id="logout">خروج</button></div>
</header>

<main>
  <section class="card login" id="loginBox" hidden>
    <h2>تسجيل دخول المشرف</h2>
    <form id="loginForm" method="post" action="#">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">كلمة المرور</label>
      <div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" id="pwToggle" aria-label="إظهار كلمة المرور">إظهار</button></div>
      <button class="btn btn-gold" type="submit">دخول</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </section>

  <section id="panel" hidden>
    <nav class="maintabs">
      <button class="maintab on" data-view="viewQuestions">الأسئلة <span class="badge" id="cNew" hidden></span></button>
      <button class="maintab" data-view="viewFeedback" id="tabFeedbackBtn">الآراء والتقييمات</button>
    </nav>

    <div id="viewQuestions">
      <div class="card">
        <h2 id="qTitle">أسئلة الزوار</h2>
        <div class="filters">
          <button class="tab qtab on" data-q="new">جديدة</button>
          <button class="tab qtab" data-q="assigned">مُسندة</button>
          <button class="tab qtab" data-q="answered">تم الرد</button>
          <button class="tab qtab" data-q="closed">مغلقة</button>
          <button class="tab qtab" data-q="all">الكل</button>
          <select id="qLang">
            <option value="">كل اللغات</option>
            <option value="ar">العربية</option><option value="en">English</option><option value="ur">اردو</option>
            <option value="fr">Français</option><option value="es">Español</option><option value="ru">Русский</option>
          </select>
        </div>
        <div id="qList"></div>
      </div>
    </div>

    <div id="viewFeedback" hidden>
    <div class="card">
      <h2>التقييمات (لا تظهر إلا للمشرفين)</h2>
      <table>
        <thead><tr><th>اللغة</th><th>العدد</th><th>المتوسط</th><th>★1</th><th>★2</th><th>★3</th><th>★4</th><th>★5</th></tr></thead>
        <tbody id="stats"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>الآراء والانطباعات</h2>
      <div class="filters">
        <button class="tab ftab on" data-status="pending">بانتظار المراجعة <span id="cPending"></span></button>
        <button class="tab ftab" data-status="approved">منشورة</button>
        <button class="tab ftab" data-status="rejected">مرفوضة</button>
        <button class="tab ftab" data-status="all">الكل</button>
        <select id="langFilter">
          <option value="">كل اللغات</option>
          <option value="ar">العربية</option><option value="en">English</option><option value="ur">اردو</option>
          <option value="fr">Français</option><option value="es">Español</option><option value="ru">Русский</option>
        </select>
      </div>
      <div id="list"></div>
    </div>
    </div>
  </section>
</main>

<script src="/js/vendor/supabase-2.119.0.js"></script>
<script>
  window.addEventListener('error', () => {
    const box = document.getElementById('loginBox');
    if (box && box.hidden && document.getElementById('panel').hidden) {
      box.hidden = false;
      document.getElementById('loginMsg').textContent = 'تعذّر تحميل اللوحة. حدّث الصفحة، وإن تكرر الخطأ فأبلغ الدعم الفني.';
    }
  });
  const sb = supabase.createClient('https://nikwwjswwlwcqekbnpzq.supabase.co', 'sb_publishable_k8fRjG4b4EMj5TH9yXR3qQ_w-fqi76l');
  const LANG = { ar:'العربية', en:'English', ur:'اردو', fr:'Français', es:'Español', ru:'Русский', all:'المجموع' };
  const STATUS = { pending:'بانتظار المراجعة', approved:'منشور', rejected:'مرفوض' };
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let status = 'pending';

  let role = null, me = null, staff = [], qStatus = 'new';

  async function start(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ $('loginBox').hidden = false; $('panel').hidden = true; $('who').hidden = true; return; }
    const { data:r, error } = await sb.rpc('my_role');
    if(error || !r){
      await sb.auth.signOut();
      $('loginBox').hidden = false; $('loginMsg').textContent = 'هذا الحساب ليس من فريق الموقع.';
      return;
    }
    role = r; me = session.user.id;
    $('loginBox').hidden = true; $('panel').hidden = false; $('who').hidden = false;
    $('whoEmail').textContent = session.user.email + (role === 'volunteer' ? ' · متطوع' : ' · مشرف');
    if(role === 'admin'){
      const { data:st } = await sb.rpc('list_staff'); staff = st || [];
      loadStats(); loadList();
    } else {
      $('tabFeedbackBtn').hidden = true;
      $('qTitle').textContent = 'الأسئلة المسندة إليك';
      qStatus = 'assigned';
      document.querySelectorAll('.qtab').forEach(x => x.classList.toggle('on', x.dataset.q === 'assigned'));
      document.querySelector('.qtab[data-q="new"]').hidden = true;
    }
    loadQuestions();
  }

  /* ---------- Questions ---------- */
  const QSTATUS = { new:'جديد', assigned:'مُسند', answered:'تم الرد', closed:'مغلق' };
  const BG = { christian:'مسيحي', jewish:'يهودي', none:'بلا دين', other:'دين آخر', muslim:'مسلم', undisclosed:'لم يحدد' };
  const METHOD = { email:'بريد', whatsapp:'واتساب', telegram:'تيليجرام' };
  const fmt = (d) => new Date(d).toLocaleString('ar-SA-u-ca-gregory', { dateStyle:'medium', timeStyle:'short' });
  const staffName = (id) => { const s = staff.find(x => x.user_id === id); return s ? (s.display_name || s.email) : (id === me ? 'أنت' : '—'); };

  function contactLink(m, v){
    const val = esc(v);
    if(m === 'email') return `<a href="mailto:${encodeURIComponent(v)}">${val}</a>`;
    if(m === 'whatsapp'){ const d = v.replace(/[^0-9]/g, ''); return `<a href="https://wa.me/${d}" target="_blank" rel="noopener">${val}</a>`; }
    const u = v.trim().replace(/^@/, '');
    return /^\+?[0-9 ]+$/.test(u) ? val : `<a href="https://t.me/${encodeURIComponent(u)}" target="_blank" rel="noopener">${val}</a>`;
  }

  async function loadQuestions(){
    let q = sb.from('questions').select('*, question_notes(id, body, created_at, author)').order('created_at', { ascending:false }).limit(200);
    if(qStatus !== 'all') q = q.eq('status', qStatus);
    if($('qLang').value) q = q.eq('lang', $('qLang').value);
    const { data, error } = await q;
    if(role === 'admin'){
      const { count } = await sb.from('questions').select('id', { count:'exact', head:true }).eq('status','new');
      $('cNew').hidden = !count; $('cNew').textContent = count || '';
    }
    if(error){ $('qList').innerHTML = `<p class="empty-list">${esc(error.message)}</p>`; return; }
    if(!data.length){ $('qList').innerHTML = '<p class="empty-list">لا توجد أسئلة هنا.</p>'; return; }
    $('qList').innerHTML = data.map(x => {
      const notes = (x.question_notes || []).sort((a,b) => a.created_at.localeCompare(b.created_at));
      const assign = role === 'admin' ? `<select data-assign="${x.id}"><option value="">— بلا إسناد —</option>${staff.map(s => `<option value="${s.user_id}" ${s.user_id===x.assigned_to?'selected':''}>${esc(s.display_name || s.email)}${s.languages && s.languages.length ? ' ('+s.languages.join('، ')+')' : ''}</option>`).join('')}</select>` : '';
      const btn = (st, label, cls) => x.status !== st ? `<button class="btn ${cls}" data-qid="${x.id}" data-qs="${st}">${label}</button>` : '';
      return `
      <div class="item ${x.status}">
        <div class="meta">
          <span class="tag ${x.status}">${QSTATUS[x.status]}</span>
          <span>${LANG[x.lang] || esc(x.lang)}</span>
          <span>${fmt(x.created_at)}</span>
          <span>${esc(x.name || 'بلا اسم')}</span>
          ${x.background ? `<span>الخلفية: ${BG[x.background] || esc(x.background)}</span>` : ''}
          ${x.assigned_to ? `<span>المسؤول: ${esc(staffName(x.assigned_to))}</span>` : ''}
        </div>
        <p class="comment">${esc(x.question)}</p>
        <div class="contact">${METHOD[x.contact_method] || ''}: ${contactLink(x.contact_method, x.contact_value)}</div>
        <div class="qrow">
          ${assign}
          ${btn('answered', 'تم الرد', 'btn-ok')}
          ${btn('closed', 'إغلاق', 'btn-ghost')}
          ${x.status === 'answered' || x.status === 'closed' ? `<button class="btn btn-ghost" data-qid="${x.id}" data-qs="${x.assigned_to ? 'assigned' : 'new'}">إعادة فتح</button>` : ''}
          <span class="inline-msg" id="qmsg${x.id}"></span>
        </div>
        <div class="notes">
          ${notes.map(n => `<div class="n">${esc(n.body)}<small>${esc(staffName(n.author))} · ${fmt(n.created_at)}</small></div>`).join('')}
          <form data-note="${x.id}"><textarea placeholder="ملاحظة داخلية (لا يراها السائل)…" maxlength="4000"></textarea><button class="btn btn-gold" type="submit">حفظ</button></form>
        </div>
      </div>`;
    }).join('');
  }

  $('qList').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-qid]'); if(!b) return;
    b.disabled = true;
    const { error } = await sb.rpc('set_question_status', { p_id: +b.dataset.qid, p_status: b.dataset.qs });
    if(error){ $('qmsg'+b.dataset.qid).textContent = error.message; b.disabled = false; return; }
    loadQuestions();
  });
  $('qList').addEventListener('change', async (e) => {
    const sel = e.target.closest('select[data-assign]'); if(!sel) return;
    const { error } = await sb.rpc('assign_question', { p_id: +sel.dataset.assign, p_user: sel.value || null });
    if(error){ $('qmsg'+sel.dataset.assign).textContent = error.message; return; }
    loadQuestions();
  });
  $('qList').addEventListener('submit', async (e) => {
    const f = e.target.closest('form[data-note]'); if(!f) return;
    e.preventDefault();
    const body = f.querySelector('textarea').value.trim(); if(!body) return;
    const { error } = await sb.from('question_notes').insert({ question_id: +f.dataset.note, body });
    if(error){ $('qmsg'+f.dataset.note).textContent = error.message; return; }
    loadQuestions();
  });
  document.querySelectorAll('.qtab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.qtab').forEach(x => x.classList.toggle('on', x === t));
    qStatus = t.dataset.q; loadQuestions();
  }));
  $('qLang').addEventListener('change', loadQuestions);
  document.querySelectorAll('.maintab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.maintab').forEach(x => x.classList.toggle('on', x === t));
    $('viewQuestions').hidden = t.dataset.view !== 'viewQuestions';
    $('viewFeedback').hidden = t.dataset.view !== 'viewFeedback';
  }));

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginMsg').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if(error){ $('loginMsg').textContent = 'البريد أو كلمة المرور غير صحيحة.'; return; }
    start();
  });
  $('pwToggle').addEventListener('click', () => {
    const pw = $('password'), show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    $('pwToggle').textContent = show ? 'إخفاء' : 'إظهار';
    $('pwToggle').setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
  });
  $('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

  async function loadStats(){
    const { data, error } = await sb.rpc('rating_stats');
    if(error){ $('stats').innerHTML = `<tr><td colspan="8">${esc(error.message)}</td></tr>`; return; }
    if(!data.length){ $('stats').innerHTML = '<tr><td colspan="8">لا توجد تقييمات بعد.</td></tr>'; return; }
    $('stats').innerHTML = data.map(r => `<tr class="${r.lang==='all'?'total':''}"><td>${LANG[r.lang]||esc(r.lang)}</td><td>${r.entries}</td><td class="avg">${r.avg_rating}</td><td>${r.stars_1}</td><td>${r.stars_2}</td><td>${r.stars_3}</td><td>${r.stars_4}</td><td>${r.stars_5}</td></tr>`).join('');
  }

  async function loadList(){
    let q = sb.from('feedback').select('*').order('created_at', { ascending:false }).limit(200);
    if(status !== 'all') q = q.eq('status', status);
    if($('langFilter').value) q = q.eq('lang', $('langFilter').value);
    const { data, error } = await q;
    const { count } = await sb.from('feedback').select('id', { count:'exact', head:true }).eq('status','pending');
    $('cPending').textContent = count ? `(${count})` : '';
    if(error){ $('list').innerHTML = `<p class="empty-list">${esc(error.message)}</p>`; return; }
    if(!data.length){ $('list').innerHTML = '<p class="empty-list">لا توجد آراء هنا.</p>'; return; }
    $('list').innerHTML = data.map(f => `
      <div class="item ${f.status}">
        <div class="meta">
          <span class="tag ${f.status}">${STATUS[f.status]}</span>
          <span class="stars">${'★'.repeat(f.rating)}${'☆'.repeat(5-f.rating)}</span>
          <span>${LANG[f.lang]||esc(f.lang)}</span>
          <span>${new Date(f.created_at).toLocaleString('ar-SA-u-ca-gregory', { dateStyle:'medium', timeStyle:'short' })}</span>
          <span>${esc(f.display_name || 'بلا اسم')}${f.country ? ' · '+esc(f.country) : ''}</span>
        </div>
        <p class="comment ${f.comment?'':'empty'}">${f.comment ? esc(f.comment) : 'تقييم بالنجوم فقط، بلا تعليق'}</p>
        <div class="actions">
          ${f.status!=='approved' ? `<button class="btn btn-ok" data-id="${f.id}" data-s="approved" ${(!f.consent_publish||!f.comment)?'disabled':''}>اعتماد للنشر</button>` : ''}
          ${f.status!=='rejected' ? `<button class="btn btn-no" data-id="${f.id}" data-s="rejected">${f.status==='approved'?'إلغاء النشر':'رفض'}</button>` : ''}
          ${f.status!=='pending' ? `<button class="btn btn-ghost" data-id="${f.id}" data-s="pending">إعادة للمراجعة</button>` : ''}
          ${!f.consent_publish ? '<span class="note">صاحب الرأي لم يوافق على النشر</span>' : ''}
        </div>
      </div>`).join('');
  }

  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-id]'); if(!b) return;
    b.disabled = true;
    const { error } = await sb.rpc('moderate_feedback', { p_id: +b.dataset.id, p_status: b.dataset.s });
    if(error){ b.disabled = false; b.textContent = 'تعذّر: ' + error.message; return; }
    loadList();
  });
  document.querySelectorAll('.ftab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.ftab').forEach(x => x.classList.toggle('on', x === t));
    status = t.dataset.status; loadList();
  }));
  $('langFilter').addEventListener('change', loadList);
  start();
</script>
</body>
</html>
