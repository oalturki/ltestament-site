<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ font-family:'Tajawal',sans-serif; line-height:1.7; background:#0A1425; }
  .fb-title{ font-family:'Tajawal',sans-serif; font-weight:600; }
  @font-face{ font-family:'KFGQPC Hafs'; src:url('/fonts/UthmanicHafs_V22.ttf') format('truetype'); font-display:swap; }
  .qz-note{ color:#C9C2AE; text-align:center; padding:12px 0; }
  .qz-scope label{ display:block; color:#DCC078; margin-bottom:10px; font-weight:700; }
  .qz-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .qz-row select{ flex:1; min-width:140px; font:inherit; font-size:1rem; padding:10px 12px; border-radius:8px; border:1px solid rgba(200,155,60,0.45); background:#0F1B33; color:#EFE6D8; }
  .qz-go{ font:inherit; font-weight:700; font-size:1rem; padding:10px 26px; border-radius:24px; border:none; background:#C89B3C; color:#101b33; cursor:pointer; margin-top:6px; }
  .qz-alt{ background:none; border:1px solid #C89B3C; color:#DCC078; }
  .qz-top{ display:flex; justify-content:space-between; color:#C9C2AE; font-size:.85rem; margin-bottom:14px; }
  .qz-ayah{ font-family:'KFGQPC Hafs','Amiri',serif; font-size:1.55rem; line-height:2.2; color:#EFE6D8; text-align:center; margin-bottom:16px; }
  .qz-ayah mark{ background:rgba(200,155,60,0.35); color:inherit; border-radius:4px; padding:0 3px; }
  .qz-ref{ font-size:.75em; color:#DCC078; white-space:nowrap; }
  .qz-q{ font-size:1.15rem; font-weight:700; color:#DCC078; margin-bottom:14px; text-align:center; }
  .qz-q b{ font-family:'KFGQPC Hafs','Amiri',serif; font-weight:400; font-size:1.25em; color:#EFE6D8; }
  .qz-opts{ display:flex; flex-direction:column; gap:10px; }
  /* voweled text in Noto Naskh Arabic: Tajawal breaks the lam-alef ligature when a vowel sits between them (لَا) */
  .qz-opts button, .qz-src{ font-family:'Noto Naskh Arabic','Amiri',serif; }
  .qz-opts button{ font-size:1.05rem; text-align:right; padding:12px 16px; border-radius:10px; border:1px solid rgba(200,155,60,0.35); background:rgba(255,255,255,0.05); color:#EFE6D8; cursor:pointer; line-height:1.6; }
  .qz-opts button:hover:not(:disabled){ border-color:#C89B3C; }
  .qz-opts button.ok{ background:rgba(62,160,116,0.3); border-color:#3EA074; }
  .qz-opts button.no{ background:rgba(200,70,60,0.28); border-color:#C8463C; }
  .qz-opts button:disabled{ cursor:default; }
  .qz-after{ margin-top:16px; text-align:center; }
  .qz-yes{ color:#6FD3A4; font-weight:700; } .qz-nope{ color:#F0A090; font-weight:700; }
  .qz-src{ color:#C9C2AE; font-size:.9rem; margin:6px 0 8px; } .qz-src a{ color:#DCC078; }
  .qz-done{ text-align:center; color:#EFE6D8; }
  .qz-score{ font-size:3rem; font-weight:800; color:#DCC078; }
  .qz-credit{ color:#8a8270; font-size:.8rem; margin-top:18px; text-align:center; }
